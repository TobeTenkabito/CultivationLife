<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>浮生问道</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header class="masthead">
    <div><small>CULTIVATION LIFE</small><h1>浮生问道</h1></div>
    <div class="header-actions"><span id="save-state" aria-live="polite"></span><button id="new" type="button">另启一世</button></div>
  </header>

  <section id="start" class="card start-card">
    <div><p class="eyebrow">新建角色</p><h2>命格初定</h2><p class="muted">每次抉择都会即时写入存档。</p></div>
    <form id="create">
      <label>道号<input name="name" required maxlength="16" value="无名散修"></label>
      <label>性别<select name="gender"><option value="male">男</option><option value="female">女</option></select></label>
      <label>灵根<select name="spirit_root" id="roots"></select></label>
      <label>道路<select name="path" id="paths"></select></label>
      <label>随机种子（可留空）<input name="seed" type="number"></label>
      <button class="primary" type="submit">叩问长生</button>
    </form>
    <section><h3>已有命途</h3><div id="saves" class="button-row empty-note"></div></section>
  </section>

  <section id="game" class="hidden game-layout">
    <aside class="sidebar">
      <section class="card identity">
        <p class="eyebrow">当前角色</p><h2 id="name"></h2><p id="realm"></p><dl id="stats"></dl>
      </section>
      <nav id="system-nav" class="card system-nav" aria-label="系统分类"></nav>
      <section class="card compact"><h3>当前状态</h3><div id="status-flags"></div></section>
    </aside>

    <section class="play-area">
      <article id="event" class="card event-card hidden">
        <p class="eyebrow">命途事件</p><h2 id="event-title"></h2><p id="event-body"></p><div id="choices" class="button-row"></div>
      </article>
      <article class="card action-card">
        <div class="section-heading"><div><p class="eyebrow">日常行动</p><h2>岁月流转</h2></div><label class="unit-input">行动单位<input id="action-units" type="number" min="1" max="100" value="1"></label></div>
        <div id="actions" class="action-grid"></div>
      </article>
      <article class="card operation-shell">
        <div class="section-heading"><div><p class="eyebrow">完整功能入口</p><h2 id="operation-title">修行</h2></div><input id="operation-search" type="search" placeholder="搜索功能……" aria-label="搜索功能"></div>
        <p id="operation-summary" class="muted"></p>
        <div id="operation-list" class="operation-list"></div>
      </article>
      <article class="card journal-card">
        <details><summary>查看当前系统信息</summary><div id="view-tabs" class="button-row"></div><div id="panel" class="state-panel"></div></details>
      </article>
    </section>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
